<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAST Islamic Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0f0f0f; }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }
  .hero img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 80%;
    display: block;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.5) 0%, rgba(0,0,0,.2) 30%, transparent 48%);
    pointer-events: none;
  }

  .title {
    position: absolute;
    z-index: 2;
    left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 8svh);
    padding: 0 5vw;
    text-align: center;
    font-family: "Anton", "Impact", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    color: #fff;
    animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both;
  }
  .title span { display: block; }

  .fast, .main span {
    text-shadow:
      0 .012em 0 #ececec,
      0 .024em 0 #d2d2d2,
      0 .036em 0 #b8b8b8,
      0 .048em 0 #9c9c9c,
      0 .07em .04em rgba(0,0,0,.55),
      0 .14em .22em rgba(0,0,0,.5);
  }

  .fast {
    font-size: clamp(30px, 11vw, 60px);
    letter-spacing: .3em;
    padding-left: .3em;
    line-height: 1;
    margin-bottom: 1vw;
  }
  .main span {
    font-size: clamp(60px, 26vw, 140px);
    line-height: .9;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .title { animation: none; } }

  @media (orientation: landscape) and (max-height: 500px) {
    .title { text-align: left; top: 6svh; padding-left: 6vw; }
    .fast { font-size: 8vh; padding-left: 0; }
    .main span { font-size: 22vh; }
  }
</style>
</head>
<body>
  <main class="hero">
    <img src="PHONEVFINAL.png" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">
    <h1 class="title">
      <span class="fast">FAST</span>
      <span class="main"><span>Islamic</span><span>Society</span></span>
    </h1>
  </main>
</body>
</html>
