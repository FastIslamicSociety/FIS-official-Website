<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Islamic Society</title>

<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="shortcut icon" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0f0f0f; }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    /* 50% 50% = center, 50% 70% = keep more grass/students, 50% 30% = keep more sky */
    --focus: 50% 62%;
  }
  .hero > img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: var(--focus);
    display: block;
  }
  /* very soft, local darkening behind the title only */
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 38% 40% at 80% 26%, rgba(25,12,0,.22), transparent 72%);
    pointer-events: none;
  }

  /* nav: restrained, truly centered middle item */
  .nav {
    position: absolute;
    top: 3.5vh; left: 3vw; right: 3vw;
    z-index: 3;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(11px, 1.05vw, 17px);
  }
  .nav > :first-child { justify-self: start; }
  .nav > :last-child  { justify-self: end; }
  .nav a, .nav span {
    color: #fff;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 14px rgba(0,0,0,.45);
    position: relative;
    padding-bottom: .3em;
    transition: transform .25s;
  }
  .nav a::after {
    content: "";
    position: absolute; left: 0; bottom: 0;
    width: 100%; height: 1.5px;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
  }
  .nav a:hover { transform: translateY(-2px); }
  .nav a:hover::after { transform: scaleX(1); }

  /* main heading: Playfair Display Black, cream, big */
  .title {
    position: absolute;
    top: 11vh;
    right: 5vw;
    z-index: 2;
    text-align: right;
    color: #fff4dc;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 900;
    font-kerning: normal;
    filter: drop-shadow(0 1px 2px rgba(20,8,0,.45))
            drop-shadow(0 6px 22px rgba(20,8,0,.4));
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }
  .title span { display: block; }
  .fast,
  .main span {
    font-size: min(6.4vw, 11vh);
    line-height: .92;
    letter-spacing: -.025em;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2vh); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .title { animation: none; } }

  /* phones / narrow windows */
  @media (max-width: 800px) {
    .hero { --focus: 68% 50%; }
    .nav { font-size: 11px; top: 2.5vh; }
    .title { top: 11svh; right: 6vw; }
    .fast, .main span { font-size: min(15vw, 9.5svh); }
  }
</style>
</head>
<body>
  <main class="hero">
    <img src="FINAL%20DESKTOP.png" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">

    <nav class="nav">
      <a href="#">FIS — 2026</a>
      <span>FAST Islamic Society</span>
      <a href="#">homepage</a>
    </nav>

    <h1 class="title">
      <span class="fast">fast</span>
      <span class="main"><span>islamic</span><span>society</span></span>
    </h1>
  </main>
</body>
</html>
