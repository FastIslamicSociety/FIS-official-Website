<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Islamic Society</title>

<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="shortcut icon" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* --bg and --acc are updated live by the script. text color never changes, so it is always readable */
  :root {
    --bg:  #2c4222;
    --acc: #d9a441;
    --ink: #f6efdc;
  }

  html { scroll-behavior: smooth; }
  html, body { background: var(--bg); }
  body { color: var(--ink); }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    /* bigger y = image shifts up. try 70% to 90% */
    --focus: 50% 85%;
  }
  .hero > img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: var(--focus);
    display: block;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 38% 40% at 80% 26%, rgba(25,12,0,.22), transparent 72%);
    pointer-events: none;
  }

  .fade {
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 7%;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(to bottom,
      color-mix(in srgb, var(--bg) 0%,  transparent) 0%,
      color-mix(in srgb, var(--bg) 30%, transparent) 55%,
      var(--bg) 100%);
  }

  .hint {
    position: absolute;
    left: 50%; bottom: 3vh;
    z-index: 3;
    width: 22px; height: 22px;
    margin-left: -11px;
    border-right: 2px solid #fff4dc;
    border-bottom: 2px solid #fff4dc;
    transform: rotate(45deg);
    opacity: .85;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
    animation: nudge 2.2s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: translateY(0) rotate(45deg); }
    50%      { transform: translateY(8px) rotate(45deg); }
  }

  .nav {
    position: absolute;
    top: 3.5vh; left: 3vw; right: 3vw;
    z-index: 3;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(11px, 1.05vw, 17px);
  }
  .nav > :first-child { justify-self: start; }
  .nav > :last-child  { justify-self: end; }
  .nav a, .nav span {
    color: #fff;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 14px rgba(0,0,0,.45);
    position: relative;
    padding-bottom: .3em;
    transition: transform .25s;
  }
  .nav a::after {
    content: "";
    position: absolute; left: 0; bottom: 0;
    width: 100%; height: 1.5px;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
  }
  .nav a:hover { transform: translateY(-2px); }
  .nav a:hover::after { transform: scaleX(1); }

  .title {
    position: absolute;
    top: 17vh;
    right: 5vw;
    z-index: 2;
    width: max-content;
    max-width: 90vw;
    color: #fff4dc;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 900;
    font-kerning: normal;
    filter: drop-shadow(0 1px 2px rgba(20,8,0,.45))
            drop-shadow(0 6px 22px rgba(20,8,0,.4));
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }
  .fast {
    display: flex;
    align-items: center;
    gap: .7em;
    font-size: min(2.2vw, 4.2vh);
    line-height: 1;
    letter-spacing: .35em;
    margin-bottom: 1.6vh;
  }
  .fast::before,
  .fast::after {
    content: "";
    flex: 1;
    height: 2px;
    background: #fff4dc;
    border-radius: 2px;
  }
  .fast span { margin-right: -.35em; }
  .main {
    display: block;
    font-size: min(4.6vw, 10vh);
    line-height: 1;
    letter-spacing: .02em;
    white-space: nowrap;
  }

  .morph {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100svh;
    padding: 14vh 6vw;
    color: var(--ink);
  }
  .morph .bar {
    width: 56px; height: 3px;
    background: var(--acc);
    margin-bottom: 2.4vh;
  }
  .morph h2 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900;
    font-size: clamp(30px, 4.4vw, 64px);
    line-height: 1.05;
    margin-bottom: 2.4vh;
  }
  .morph p {
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    max-width: 58ch;
    line-height: 1.65;
    font-size: clamp(14px, 1.2vw, 19px);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2vh); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .title, .hint { animation: none; }
    html { scroll-behavior: auto; }
  }

  @media (max-width: 800px) {
    .hero { --focus: 68% 50%; }
    .nav { font-size: 11px; top: 2.5vh; }
    .title { top: 11svh; right: 6vw; max-width: none; }
    .fast { font-size: 4vw; margin-bottom: 1.2svh; }
    .fast::before, .fast::after { height: 1.5px; }
    .main { font-size: 9vw; }
    .fade { height: 6%; }
  }
</style>
</head>
<body>
  <main class="hero">
    <img src="FINAL%20DESKTOP.png" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">
    <div class="fade"></div>

    <nav class="nav">
      <a href="#">FIS — 2026</a>
      <span>FAST Islamic Society</span>
      <a href="#">homepage</a>
    </nav>

    <h1 class="title">
      <div class="fast"><span>FAST</span></div>
      <span class="main">ISLAMIC SOCIETY</span>
    </h1>

    <div class="hint" aria-hidden="true"></div>
  </main>

  <!-- data-bg = this section's page color, data-acc = accent line color.
       all backgrounds are dark so the cream text stays readable. -->
  <section class="morph" data-bg="#2a4b34" data-acc="#d9a441">
    <div class="bar"></div>
    <h2>About FIS</h2>
    <p>Your about text goes here.</p>
  </section>

  <section class="morph" data-bg="#1f4846" data-acc="#e0b455">
    <div class="bar"></div>
    <h2>Messages</h2>
    <p>President and CP messages go here.</p>
  </section>

  <section class="morph" data-bg="#3f4a2a" data-acc="#e8b85c">
    <div class="bar"></div>
    <h2>Archive</h2>
    <p>Polaroids and past events go here.</p>
  </section>

  <section class="morph" data-bg="#3a2d20" data-acc="#e8b85c">
    <div class="bar"></div>
    <h2>Closing hadith</h2>
    <p>Closing line goes here.</p>
  </section>

<script>
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = a => "rgb(" + a[0] + "," + a[1] + "," + a[2] + ")";
  const ease = t => t * t * (3 - 2 * t);

  const base = { bg: hex("#2c4222"), acc: hex("#d9a441") };
  const secs = [...document.querySelectorAll(".morph")].map(el => ({
    el,
    bg: hex(el.dataset.bg),
    acc: hex(el.dataset.acc)
  }));

  const root = document.documentElement;
  let ticking = false;

  function paint() {
    ticking = false;
    const vh = window.innerHeight;
    let bg = base.bg, acc = base.acc;

    secs.forEach(s => {
      const top = s.el.getBoundingClientRect().top;
      /* long, gentle blend: starts when the section is 95% down the screen, finishes about 90% of a screen later */
      const p = ease(Math.min(1, Math.max(0, (vh * 0.95 - top) / (vh * 0.9))));
      if (p > 0) {
        bg  = mix(bg,  s.bg,  p);
        acc = mix(acc, s.acc, p);
      }
    });

    root.style.setProperty("--bg",  rgb(bg));
    root.style.setProperty("--acc", rgb(acc));
  }

  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(paint); }
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  paint();
</script>
</body>
</html>
