<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Islamic Society</title>
<script>
  if (window.innerWidth < 800) location.replace("mobile.html");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0f0f0f; height: 100%; overflow: hidden; }

  .hero {
    --u: min(1vw, 1.65vh);
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .hero img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    display: block;
  }

  .title {
    position: absolute;
    top: 6vh;
    right: 5vw;
    z-index: 2;
    text-align: right;
    font-family: "Anton", "Impact", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    /* one soft shadow for the whole block = lifted off the image */
    filter: drop-shadow(0 .25vh .5vh rgba(0,0,0,.35))
            drop-shadow(0 1vh 2.2vh rgba(0,0,0,.35));
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }
  .title span { display: block; }

  /* cream with a soft fade, like the reference */
  .fast, .main span {
    background: linear-gradient(180deg, #fffdf7 0%, #fff3d8 55%, #f1dfb4 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
  }

  .fast {
    font-size: calc(var(--u) * 4.4);
    letter-spacing: calc(var(--u) * .5);
    line-height: 1;
    margin-bottom: calc(var(--u) * .4);
  }
  .main span {
    font-size: calc(var(--u) * 11);
    line-height: .9;
    letter-spacing: calc(var(--u) * .12);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2vh); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .title { animation: none; } }
</style>
</head>
<body>
  <main class="hero">
    <img src="FINAL%20DESKTOP.png" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">
    <h1 class="title">
      <span class="fast">FAST</span>
      <span class="main"><span>Islamic</span><span>Society</span></span>
    </h1>
  </main>
</body>
</html>
