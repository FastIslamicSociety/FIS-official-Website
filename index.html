<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Islamic Society</title>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=sentient@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0f0f0f; }

  /* full width, natural height: nothing cropped, no side bars */
  .stage {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
  }
  .stage > img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* floating nav */
  .nav {
    position: absolute;
    top: 2.2cqw; left: 3cqw; right: 3cqw;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    font-size: max(11px, 1.05cqw);
    text-transform: lowercase;
  }
  .nav a, .nav span {
    color: #fff;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 14px rgba(0,0,0,.45);
    position: relative;
    padding-bottom: .3em;
    transition: transform .25s;
  }
  .nav a::after {
    content: "";
    position: absolute; left: 0; bottom: 0;
    width: 100%; height: 1.5px;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
  }
  .nav a:hover { transform: translateY(-2px); }
  .nav a:hover::after { transform: scaleX(1); }

  /* title */
  .title {
    position: absolute;
    top: 6cqw;
    right: 5cqw;
    z-index: 2;
    text-align: right;
    color: #fff8e8;
    font-family: "Sentient", Georgia, "Times New Roman", serif;
    font-weight: 700;
    text-transform: lowercase;
    filter: drop-shadow(0 .15cqw .3cqw rgba(0,0,0,.35))
            drop-shadow(0 .6cqw 1.4cqw rgba(0,0,0,.35));
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }
  .title span { display: block; }
  .fast,
  .main span {
    font-size: 5.2cqw;
    line-height: .95;
    letter-spacing: -.02em;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2cqw); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .title { animation: none; } }
</style>
</head>
<body>
  <main class="stage">
    <img src="FINAL%20DESKTOP.png" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">

    <nav class="nav">
      <a href="#">FIS — 2026</a>
      <span>fast islamic society</span>
      <a href="#">homepage</a>
    </nav>

    <h1 class="title">
      <span class="fast">fast</span>
      <span class="main"><span>islamic</span><span>society</span></span>
    </h1>
  </main>
</body>
</html>
