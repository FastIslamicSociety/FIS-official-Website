<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Islamic Society</title>

<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="shortcut icon" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0f0f0f; }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    --focus: 50% 62%;
  }
  .hero > img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: var(--focus);
    display: block;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 38% 40% at 80% 26%, rgba(25,12,0,.22), transparent 72%);
    pointer-events: none;
  }

  .nav {
    position: absolute;
    top: 3.5vh; left: 3vw; right: 3vw;
    z-index: 3;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(11px, 1.05vw, 17px);
  }
  .nav > :first-child { justify-self: start; }
  .nav > :last-child  { justify-self: end; }
  .nav a, .nav span {
    color: #fff;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 14px rgba(0,0,0,.45);
    position: relative;
    padding-bottom: .3em;
    transition: transform .25s;
  }
  .nav a::after {
    content: "";
    position: absolute; left: 0; bottom: 0;
    width: 100%; height: 1.5px;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
  }
  .nav a:hover { transform: translateY(-2px); }
  .nav a:hover::after { transform: scaleX(1); }

  .title {
    position: absolute;
    top: 17vh;
    right: 5vw;
    z-index: 2;
    width: max-content;
    max-width: 90vw;
    color: #fff4dc;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 900;
    font-kerning: normal;
    filter: drop-shadow(0 1px 2px rgba(20,8,0,.45))
            drop-shadow(0 6px 22px rgba(20,8,0,.4));
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }

  /* ------- FAST ------- : lines stretch to fill the full width of the title */
  .fast {
    display: flex;
    align-items: center;
    gap: .7em;
    font-size: min(2.2vw, 4.2vh);
    line-height: 1;
    letter-spacing: .35em;
    margin-bottom: 1.6vh;
  }
  .fast::before,
  .fast::after {
    content: "";
    flex: 1;
    height: 2px;
    background: #fff4dc;
    border-radius: 2px;
  }
  .fast span { margin-right: -.35em; }

  .main {
    display: block;
    font-size: min(4.6vw, 10vh);
    line-height: 1;
    letter-spacing: .02em;
    white-space: nowrap;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2vh); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .title { animation: none; } }

  @media (max-width: 800px) {
    .hero { --focus: 68% 50%; }
    .nav { font-size: 11px; top: 2.5vh; }
    .title { top: 11svh; right: 6vw; max-width: none; }
    .fast { font-size: 4vw; margin-bottom: 1.2svh; }
    .fast::before, .fast::after { height: 1.5px; }
    .main { font-size: 9vw; }
  }

  /* ===== below the hero: grass-to-light-green flow ===== */
  :root { --grass: #4b5a23; }   /* change this to the hero's bottom grass color (eyedropper it) */

  .rest {
    background: linear-gradient(180deg,
      var(--grass) 0%,
      #5a6b2c 25%,
      #7f9444 50%,
      #b9cb85 75%,
      #eef0d4 100%);
    font-family: "Archivo", system-ui, sans-serif;
  }
  .rest section {
    min-height: 90vh;
    padding: 14vh 8vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2.4vh;
  }
  .rest h2 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900;
    font-size: clamp(34px, 5vw, 76px);
    line-height: 1;
  }
  .rest p {
    font-weight: 400;
    font-size: clamp(16px, 1.3vw, 21px);
    line-height: 1.6;
    max-width: 56ch;
  }
  /* text flips from cream to dark green where the background gets light */
  .rest .on-dark  { color: #fff4dc; }
  .rest .on-light { color: #26290d; }
</style>
</head>
<body>
  <main class="hero">
    <img src="FINAL%20DESKTOP.png" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">

    <nav class="nav">
      <a href="#">FIS — 2026</a>
      <span>FAST Islamic Society</span>
      <a href="#">homepage</a>
    </nav>

    <h1 class="title">
      <div class="fast"><span>FAST</span></div>
      <span class="main">ISLAMIC SOCIETY</span>
    </h1>
  </main>

  <div class="rest">
    <section class="on-dark">
      <h2>About</h2>
      <p>Who we are and what FIS is about.</p>
    </section>
    <section class="on-dark">
      <h2>Events</h2>
      <p>Gatherings, talks and what's coming up.</p>
    </section>
    <section class="on-light">
      <h2>Team</h2>
      <p>The people behind the society.</p>
    </section>
    <section class="on-light">
      <h2>Join</h2>
      <p>How to get involved.</p>
    </section>
  </div>
</body>
</html>
