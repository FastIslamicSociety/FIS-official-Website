<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Islamic Society</title>
<script>
  if (window.innerWidth < 800) location.replace("mobile.html");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0f0f0f; min-height: 100%; }
  body { display: grid; place-items: center; min-height: 100vh; }

  .poster {
    container-type: inline-size;
    position: relative;
    width: min(100vw, 177.78vh);
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  .poster img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .poster::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 45% 50% at 80% 22%, rgba(0,0,0,.3), transparent 70%);
    pointer-events: none;
  }

  .title {
    position: absolute;
    top: 4.5cqw;
    right: 5cqw;
    z-index: 2;
    text-align: right;
    font-family: "Anton", "Impact", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    color: #fff;
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }
  .title span { display: block; }

  /* raised / embossed look: stacked shadow = 3D thickness, blur = lift off the image */
  .fast, .main span {
    text-shadow:
      0 .012em 0 #ececec,
      0 .024em 0 #d2d2d2,
      0 .036em 0 #b8b8b8,
      0 .048em 0 #9c9c9c,
      0 .07em .04em rgba(0,0,0,.55),
      0 .14em .22em rgba(0,0,0,.5);
  }

  .fast {
    font-size: 4.6cqw;
    letter-spacing: .5cqw;
    line-height: 1;
    margin-bottom: .5cqw;
  }
  .main span {
    font-size: 11.5cqw;
    line-height: .88;
    letter-spacing: .1cqw;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2cqw); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .title { animation: none; } }
</style>
</head>
<body>
  <main class="poster">
    <img src="FINAL%20DESKTOP.png" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">
    <h1 class="title">
      <span class="fast">FAST</span>
      <span class="main"><span>Islamic</span><span>Society</span></span>
    </h1>
  </main>
</body>
</html>
