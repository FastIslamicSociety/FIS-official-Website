<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Islamic Society</title>
<script>
  if (window.innerWidth < 800) location.replace("mobile.html");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0f0f0f; height: 100%; overflow: hidden; }

  .hero {
    /* one scaling unit: text follows whichever is smaller, width or height */
    --u: min(1vw, 1.65vh);
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .hero img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 50%;   /* raise % to show more of the bottom, lower to show more sky */
    display: block;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 40% 45% at 80% 22%, rgba(0,0,0,.28), transparent 70%);
    pointer-events: none;
  }

  .title {
    position: absolute;
    top: 4vh;
    right: 5vw;
    z-index: 2;
    text-align: right;
    font-family: "Anton", "Impact", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    color: #fff;
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }
  .title span { display: block; }

  /* raised / embossed look */
  .fast, .main span {
    text-shadow:
      0 .012em 0 #ececec,
      0 .024em 0 #d2d2d2,
      0 .036em 0 #b8b8b8,
      0 .048em 0 #9c9c9c,
      0 .07em .04em rgba(0,0,0,.55),
      0 .14em .22em rgba(0,0,0,.5);
  }

  .fast {
    font-size: calc(var(--u) * 4.6);
    letter-spacing: calc(var(--u) * .5);
    line-height: 1;
    margin-bottom: calc(var(--u) * .5);
  }
  .main span {
    font-size: calc(var(--u) * 11);
    line-height: .88;
    letter-spacing: calc(var(--u) * .1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2vh); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .title { animation: none; } }
</style>
</head>
<body>
  <main class="hero">
    <img src="FINAL%20DESKTOP.png" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">
    <h1 class="title">
      <span class="fast">FAST</span>
      <span class="main"><span>Islamic</span><span>Society</span></span>
    </h1>
  </main>
</body>
</html>
