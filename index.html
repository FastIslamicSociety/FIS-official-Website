
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAST Islamic Society</title>

  <script>
    if (window.innerWidth < 800) {
      window.location.replace("mobile.html");
    }
  </script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f0f;
    }

    /* FULL-SCREEN HERO */
    .hero {
      --u: min(1vw, 1.65vh);

      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    /* BACKGROUND IMAGE */
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: -2;
    }

    /* SUBTLE DARKENING BEHIND THE TITLE */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(
          ellipse 40% 45% at 80% 22%,
          rgba(0, 0, 0, 0.28),
          transparent 70%
        );
      pointer-events: none;
    }

    /* MAIN TITLE POSITION */
    .title {
      position: absolute;
      top: 5vh;
      right: 5vw;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: flex-end;

      font-family: "Anton", Impact, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      text-align: right;
      color: #fff;

      animation: rise 1.2s cubic-bezier(.2, .7, .2, 1) both;
    }

    .title span {
      display: block;
    }

    /* FAST */
    .fast {
      font-size: calc(var(--u) * 4.6);
      line-height: 1;
      letter-spacing: calc(var(--u) * 0.5);
      margin-bottom: calc(var(--u) * 0.5);

      text-shadow:
        0 1px 0 #ececec,
        0 2px 0 #d2d2d2,
        0 3px 0 #b8b8b8,
        0 5px 3px rgba(0, 0, 0, 0.55),
        0 9px 12px rgba(0, 0, 0, 0.5);
    }

    /* ISLAMIC SOCIETY */
    .main {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .main span {
      font-size: calc(var(--u) * 11);
      line-height: 0.88;
      letter-spacing: calc(var(--u) * 0.1);

      text-shadow:
        0 1px 0 #ececec,
        0 2px 0 #d2d2d2,
        0 3px 0 #b8b8b8,
        0 5px 3px rgba(0, 0, 0, 0.55),
        0 9px 12px rgba(0, 0, 0, 0.5);
    }

    /* ENTRANCE ANIMATION */
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(2vh);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .title {
        animation: none;
      }
    }

    /* SMALL DESKTOP / LANDSCAPE TABLETS */
    @media (min-width: 800px) and (max-width: 1100px) {
      .title {
        top: 4vh;
        right: 4vw;
      }

      .main span {
        font-size: calc(var(--u) * 10);
      }
    }
  </style>
</head>

<body>
  <main class="hero">

    <img
      src="FINAL%20DESKTOP.png"
      alt="Students sitting beneath a tree at sunset in front of the FAST campus"
    >

    <h1 class="title">
      <span class="fast">FAST</span>

      <span class="main">
        <span>Islamic</span>
        <span>Society</span>
      </span>
    </h1>

  </main>
</body>
</html>
