<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Islamic Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff4dc;
    --gold: #e8c46a;
    --bg: #0f0f0f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); min-height: 100%; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
  }

  /* Poster: 16:9, everything scales with its own width (cqw) */
  .poster {
    container-type: inline-size;
    position: relative;
    width: min(100vw, 177.78vh);
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  .poster img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .poster::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 45% 50% at 80% 20%, rgba(0,0,0,.35), transparent 70%);
    pointer-events: none;
  }

  .title {
    position: absolute;
    top: 5cqw;
    right: 5cqw;
    z-index: 2;
    text-align: right;
    color: var(--cream);
    text-shadow: 0 .3cqw 1.4cqw rgba(0,0,0,.55);
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }

  .fast {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1.4cqw;
    font-family: "Montserrat", sans-serif;
    font-weight: 700;
    font-size: 3.2cqw;
    letter-spacing: .9cqw;
    color: var(--gold);
    margin-bottom: .8cqw;
    padding-right: .1cqw;
  }
  .fast::before {
    content: "";
    height: .25cqw;
    width: 9cqw;
    background: linear-gradient(to right, transparent, var(--gold));
  }

  .main {
    font-family: "Anton", "Impact", sans-serif;
    font-weight: 400;
    font-size: 10.5cqw;
    line-height: .92;
    text-transform: uppercase;
    letter-spacing: .1cqw;
  }
  .main span { display: block; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(2cqw); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .title { animation: none; }
  }
</style>
</head>
<body>
  <main class="poster">
    <img src="hero-desktop.jpg" alt="Students sitting under a banyan tree at sunset in front of the FAST campus">
    <h1 class="title">
      <span class="fast">FAST</span>
      <span class="main"><span>Islamic</span><span>Society</span></span>
    </h1>
  </main>
</body>
</html>
